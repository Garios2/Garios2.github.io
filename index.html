<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Curriculum Vitae of Wenjie Zhou" />
    <title>Wenjie Zhou | Curriculum Vitae</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f6f8;
        color: #172033;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.85rem 1.25rem; background: rgba(255, 255, 255, 0.96); border-bottom: 1px solid #dce2ea; }
      h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.15rem, 3vw, 1.55rem); font-weight: 600; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 2.5rem; padding: 0.6rem 1rem; border-radius: 999px; background: #0b57d0; color: #fff; font-size: 0.9rem; font-weight: 650; text-decoration: none; }
      a:hover { background: #0847ad; }
      main { flex: 1; display: flex; padding: 1rem; }
      .preview { display: block; width: min(100%, 66rem); min-height: 0; margin: 0 auto; padding: 0; border-radius: 0.75rem; background: transparent; }
      .preview img { display: block; width: 100%; height: auto; border: 1px solid #dce2ea; border-radius: 0.75rem; background: #fff; box-shadow: 0 12px 35px rgba(21, 31, 50, 0.08); }
      @media (max-width: 600px) { header { padding: 0.75rem; } main { padding: 0; } .preview img { border-radius: 0; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Wenjie Zhou · Curriculum Vitae</h1>
      <a href="CV.pdf" download>Download PDF</a>
    </header>
    <main>
      <a class="preview" href="CV.pdf" aria-label="Open the curriculum vitae as a PDF">
        <img src="cv-preview.png" alt="Wenjie Zhou curriculum vitae" />
      </a>
    </main>
  </body>
</html>
