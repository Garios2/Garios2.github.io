<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Spectral preferences of Bregman divergences</title>
  <desc id="desc">A schematic showing how Frobenius, von Neumann and LogDet divergences allocate approximation error across the dominant and tail eigenspaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3efe8"/>
      <stop offset="1" stop-color="#e7edef"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" rx="28" fill="url(#bg)"/>
  <g transform="translate(74 72)" font-family="Arial, sans-serif">
    <text x="0" y="0" fill="#1d2b31" font-size="16" font-weight="700" letter-spacing="1.7">SPECTRAL ERROR ALLOCATION</text>
    <text x="0" y="34" fill="#1d2b31" font-size="14" opacity=".58">same Kronecker budget · different geometric bias</text>
    <g transform="translate(0 96)">
      <text x="0" y="22" fill="#1d2b31" font-size="16">Frobenius</text>
      <rect x="154" width="650" height="34" rx="17" fill="#1d2b31" opacity=".08"/>
      <rect x="154" width="480" height="34" rx="17" fill="#274b57"/>
      <circle cx="658" cy="17" r="11" fill="#b4513e"/>
      <text x="704" y="22" fill="#1d2b31" font-size="13" opacity=".55">top spectrum</text>
    </g>
    <g transform="translate(0 190)">
      <text x="0" y="22" fill="#1d2b31" font-size="16">von Neumann</text>
      <rect x="154" width="650" height="34" rx="17" fill="#1d2b31" opacity=".08"/>
      <rect x="154" width="365" height="34" rx="17" fill="#6c8d99"/>
      <circle cx="543" cy="17" r="11" fill="#b4513e"/>
      <text x="704" y="22" fill="#1d2b31" font-size="13" opacity=".55">balanced</text>
    </g>
    <g transform="translate(0 284)">
      <text x="0" y="22" fill="#1d2b31" font-size="16">LogDet</text>
      <rect x="154" width="650" height="34" rx="17" fill="#1d2b31" opacity=".08"/>
      <rect x="154" width="235" height="34" rx="17" fill="#c3944c"/>
      <circle cx="413" cy="17" r="11" fill="#b4513e"/>
      <text x="704" y="22" fill="#1d2b31" font-size="13" opacity=".55">tail spectrum</text>
    </g>
    <path d="M154 366H804" stroke="#1d2b31" stroke-width="1.5" opacity=".28"/>
    <text x="154" y="400" fill="#1d2b31" font-size="13" opacity=".55">tail eigenspace</text>
    <text x="706" y="400" fill="#1d2b31" font-size="13" opacity=".55">dominant eigenspace</text>
  </g>
</svg>
