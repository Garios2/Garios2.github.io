<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Effective learning rate as a scale-transfer signal</title>
  <desc id="desc">A schematic comparing scattered loss predictions from raw learning rate with aligned predictions from effective learning rate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0e8"/>
      <stop offset="1" stop-color="#e8eff1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c8d99"/>
      <stop offset="1" stop-color="#b4513e"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" rx="28" fill="url(#bg)"/>
  <g fill="none" stroke="#1d2b31" stroke-opacity=".13">
    <path d="M86 110H874M86 210H874M86 310H874M86 410H874"/>
    <path d="M190 70V468M370 70V468M550 70V468M730 70V468"/>
  </g>
  <path d="M92 409C210 400 244 327 343 319C454 310 470 247 571 238C673 229 737 165 864 148" fill="none" stroke="url(#line)" stroke-width="10" stroke-linecap="round"/>
  <path d="M92 448C202 412 264 369 354 340C469 303 566 279 666 228C740 190 799 155 864 116" fill="none" stroke="#1d2b31" stroke-width="2" stroke-dasharray="7 10" opacity=".42"/>
  <g fill="#b4513e">
    <circle cx="190" cy="381" r="8"/><circle cx="370" cy="313" r="8"/><circle cx="550" cy="247" r="8"/><circle cx="730" cy="177" r="8"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#1d2b31">
    <text x="86" y="66" font-size="22" font-weight="700" letter-spacing="2">ELR</text>
    <text x="86" y="94" font-size="15" opacity=".62">one training signal, across model scales</text>
    <text x="782" y="500" font-size="15" opacity=".62">training time →</text>
    <text x="704" y="93" font-size="48" font-family="Georgia, serif" font-style="italic">η<tspan baseline-shift="sub" font-size="24">eff</tspan></text>
  </g>
</svg>
